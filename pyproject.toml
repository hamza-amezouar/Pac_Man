[project]
name = "pac-man"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clear>=2.0.0",
    "mypy>=2.3.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pygame>=2.6.1",
    "yapf>=0.43.0",
]

[project.scripts]
pac-man = "pac_man:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
